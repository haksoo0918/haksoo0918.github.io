  <!-- Lucide Icons 공식 CDN 로드 -->

  <!-- VoiceBox Editorial 스타일시트 -->
  <link rel="stylesheet" href="assets/css/style.css" />

  <!-- JSON-LD 구조화 데이터 (SEO 스키마) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://haksoo0918.github.io/#website",
        "url": "https://haksoo0918.github.io/",

      },
      {

        "@id": "https://haksoo0918.github.io/#person",
        "name": "HS",
        "url": "https://haksoo0918.github.io/",

<body>

  <!-- 에디토리얼 상단 마스트헤드 네비게이션 -->
  <header class="site-header" role="banner">
    <div class="container">
      <div class="masthead-inner">
        <div class="brand-logo">
          <a href="/">HS<span class="brand-dot">.</span>HUB</a>
        </div>
        <nav aria-label="메인 메뉴">
          <ul class="nav-links">
            <li><a href="#projects" class="nav-link">Projects</a></li>
            <li><a href="https://blog.haksoo0918.workers.dev/" target="_blank" rel="noopener noreferrer" class="nav-link inline-icon-link">Blog <i data-lucide="external-link" class="icon-sm"></i></a></li>
            <li><a href="https://github.com/haksoo0918" target="_blank" rel="noopener noreferrer" class="nav-link inline-icon-link">GitHub <i data-lucide="external-link" class="icon-sm"></i></a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <main id="main-content">
    <!-- 히어로 섹션 -->
    <section class="hero-section" aria-labelledby="hero-heading">
      <div class="container">
        <span class="overline-rubric">HS / WORKSPACE</span>
        <h1 id="hero-heading" class="hero-title">HANDCRAFTED &amp; HOBBY PROJECTS</h1>
        <p class="hero-description">
          가내수공업처럼 뚝딱뚝딱 만드는 <strong>sosoFactory</strong>의 실용적인 웹 도구들과, 비트코인 퀀트·블로그 등 <strong>개인적인 취미와 호기심</strong>으로 만든 프로젝트들을 모아둔 공간입니다.
        </p>
        <div class="hero-actions">
          <a href="#projects" class="btn btn-primary">프로젝트 둘러보기</a>
          <a href="https://blog.haksoo0918.workers.dev/" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">블로그 바로가기 <i data-lucide="external-link" class="icon-sm"></i></a>
        </div>
      </div>
    </section>

    <!-- 프로젝트 쇼케이스 섹션 -->
    <section id="projects" class="projects-section" aria-labelledby="projects-heading">
      <div class="container">
        <!-- 필터 컨트롤 바 -->
        <div class="filter-bar-wrapper">
          <h2 id="projects-heading" class="section-headline">SELECTED PROJECTS</h2>
          <div class="filter-chips" role="group" aria-label="프로젝트 카테고리 필터">
            <button type="button" class="filter-chip active" data-category="all">전체 (ALL)</button>
            <button type="button" class="filter-chip" data-category="sosoFactory">sosoFactory</button>
            <button type="button" class="filter-chip" data-category="personal">개인 프로젝트</button>
          </div>
        </div>

        <!-- 동적 카드 그리드 컨테이너 -->
        <div id="projects-grid" class="projects-grid" aria-live="polite">
          <!-- main.js에 의해 projects.json 데이터가 동적으로 렌더링됩니다 -->
        </div>
      </div>
    </section>
  </main>

  <!-- 에디토리얼 푸터 -->
  <footer class="site-footer" role="contentinfo">

        </div>
        <ul class="footer-links">

          <li><a href="https://blog.haksoo0918.workers.dev/" target="_blank" rel="noopener noreferrer" class="inline-icon-link">Blog <i data-lucide="external-link" class="icon-sm"></i></a></li>
        </ul>
      </div>
    </div>
  </footer>

  <script src="assets/js/main.js" defer></script>

</html>
